<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | TubeMastery</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-container">
    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
            <span class="auth-logo-icon">▶</span>
            TubeMastery
        </div>

        <!-- Titre -->
        <h1>Bon retour !</h1>
        <p>Connecte-toi pour retrouver ton espace TubeMastery.</p>

        <!-- Message de succès -->
        <div th:if="${successMessage}"
             class="success"
             th:text="${successMessage}">
        </div>

        <!-- Message de déconnexion -->
        <div th:if="${param.logout}" class="success">
            Tu as été déconnecté avec succès.
        </div>

        <!-- Message d'erreur -->
        <div th:if="${param.error}" class="error">
            Nom d'utilisateur ou mot de passe incorrect.
        </div>

        <!-- Formulaire de connexion -->
        <form th:action="@{/auth/login}" method="post">

            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ton nom d'utilisateur"
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ton mot de passe"
                        autocomplete="current-password"
                        required>
                    <button type="button"
                            class="toggle-password"
                            data-target="password"
                            aria-label="Afficher le mot de passe"
                            aria-pressed="false">
                        <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit">
                Se connecter
            </button>

        </form>

        <!-- Pied de page -->
        <div class="auth-footer">
            Tu n'as pas encore de compte ?
            <br>
            <a th:href="@{/auth/register}">
                Créer un compte gratuitement
            </a>
        </div>

    </div>
</div>

<script th:src="@{/js/auth.js}"></script>

</body>
</html>
