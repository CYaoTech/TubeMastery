spring.application.name=TubeMastery
# Emplacement du fichier de la base de données (crée un fichier "the_db_file" à la racine du projet)
spring.datasource.url=jdbc:h2:file:./the_db_file
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Active l'interface web pour voir la base de données sur le navigateur
spring.h2.console.enabled=true

# METTRE À JOUR les tables sans JAMAIS supprimer les données existantes
spring.jpa.hibernate.ddl-auto=update


# Scraping YouTube (Selenium + Chrome headless). Chemin de Chrome optionnel (sinon détection automatique)
youtube.scraper.chrome-binary=${CHROME_BIN:}
youtube.scraper.timeout-seconds=20

# Cache de cartes pré-scrapées en tâche de fond (ouverture de paquet instantanée)
pool.cache.target-size=300
pool.cache.parallelism=2
