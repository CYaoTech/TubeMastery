# Profil dev : actif automatiquement avec ./mvnw spring-boot:run
# Lit les templates et fichiers statiques directement depuis src/, sans cache,
# pour voir les modifications en rafraîchissant la page (sans redémarrer).
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.cache=false
spring.web.resources.static-locations=file:src/main/resources/static/
spring.web.resources.cache.period=0
