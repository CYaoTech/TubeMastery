<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head :: head('Ma collection')}"></head>
<body>

<header th:replace="~{fragment/topbar :: topbar('home')}"></header>

<main>

        <div class="heading">
            <div>
                <h1>Ma collection</h1>
                <p class="muted">
                    <span id="card-count" th:text="${#lists.size(cards)}">0</span>

                    <span id="card-count-label" th:text="${#lists.size(cards) > 1} ? 'cartes' : 'carte'">cartes</span>
                </p>
            </div>
        </div>

    <div class="rarity-filter" th:unless="${#lists.isEmpty(cards)}">
        <div class="rarity-filter-buttons" role="group" aria-label="Filtrer par rareté">
            <button type="button" class="rarity-btn" data-rarity="B" aria-pressed="false" title="Basique" aria-label="Basique"><span class="rarity-badge rarity-b">B</span></button>
            <button type="button" class="rarity-btn" data-rarity="C" aria-pressed="false" title="Commun" aria-label="Commun"><span class="rarity-badge rarity-c">C</span></button>
            <button type="button" class="rarity-btn" data-rarity="R" aria-pressed="false" title="Rare" aria-label="Rare"><span class="rarity-badge rarity-r">R</span></button>
            <button type="button" class="rarity-btn" data-rarity="UR" aria-pressed="false" title="Ultra Rare" aria-label="Ultra Rare"><span class="rarity-badge rarity-ur">UR</span></button>
            <button type="button" class="rarity-btn" data-rarity="L" aria-pressed="false" title="Légendaire" aria-label="Légendaire"><span class="rarity-badge rarity-l">L</span></button>
            <button type="button" class="rarity-btn" data-rarity="M" aria-pressed="false" title="Mythique" aria-label="Mythique"><span class="rarity-badge rarity-m">M</span></button>
        </div>
        <form id="discard-all-form" th:action="@{/home/discard-rarities}" method="post">
            <button th:replace="~{fragment/button :: action('submit', 'btn-discard', 'discard-all', '🗑️', 'Tout défausser', 'Sélectionne au moins une rareté', null, true)}"></button>
        </form>
    </div>

    <div th:if="${successMessage}" class="alert success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

    <p class="empty" th:if="${#lists.isEmpty(cards)}">
        Tu n'as encore aucune carte. Clique sur « Obtenir une carte » pour commencer ta collection !
    </p>

    <section class="grid" th:unless="${#lists.isEmpty(cards)}">
        <th:block th:each="c : ${cards}">
            <article th:replace="~{fragment/card :: card(${c})}"></article>
        </th:block>
    </section>
</main>

<!-- Modal : la carte cliquée en grand (rempli par /js/home.js) -->
<dialog id="card-modal" class="card-modal" aria-labelledby="modal-name">
    <button type="button" class="modal-close" aria-label="Fermer">&times;</button>
    <div class="flip" id="modal-flip" tabindex="0" role="button"
         aria-label="Retourner la carte" title="Clique pour retourner la carte">
        <div class="flip-inner">
            <div class="flip-face flip-front">
                <img id="modal-img" src="" alt="" referrerpolicy="no-referrer">
                <div class="modal-body">
                    <h2 id="modal-name"></h2>
                    <a th:replace="~{fragment/button :: channel('modal-channel')}"></a>
                    <p id="modal-subs" class="card-subs"></p>
                    <p id="modal-desc" class="modal-desc"></p>
                    <form th:action="@{/home/discard}" method="post" class="modal-actions">
                        <input type="hidden" name="cardId" id="modal-card-id">
                        <button th:replace="~{fragment/button :: action('button', 'btn-auction', 'modal-auction', '🔨', 'Enchères', 'Mettre aux enchères', 'Mettre cette carte aux enchères', false)}"></button>
                        <button th:replace="~{fragment/button :: action('submit', 'btn-discard', null, '🗑️', '+1 TubeCoin', 'Défausser contre 1 TubeCoin', 'Défausser cette carte contre 1 TubeCoin', false)}"></button>
                    </form>
                </div>
            </div>
            <div class="flip-face flip-back">
                <img th:src="@{/img/back.png}" alt="Dos de la carte">
            </div>
        </div>
    </div>
</dialog>

<!-- Modal : mise aux enchères de la carte ouverte -->
<dialog th:replace="~{fragment/auction-form :: auctionForm}"></dialog>

<script th:src="@{/js/home.js}" defer></script>

</body>
</html>
