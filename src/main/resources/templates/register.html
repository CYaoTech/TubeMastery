<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription | TubeMastery</title>

    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>

<main class="auth-container">

    <div class="auth-card">

        <h1>TubeMastery</h1>
        <h2>Créer un compte</h2>

        <p>Rejoins la communauté TubeMastery !</p>

        <div class="error-message"
             th:if="${errorMessage}"
             th:text="${errorMessage}">
        </div>

        <form th:action="@{/auth/register}"
              th:object="${registerRequest}"
              method="post">

            <div class="form-group">
                <label for="username">Pseudo</label>

                <input type="text"
                       id="username"
                       th:field="*{username}"
                       autocomplete="username"
                       required>

                <small th:if="${#fields.hasErrors('username')}"
                       th:errors="*{username}">
                </small>
            </div>

            <div class="form-group">
                <label for="email">Adresse e-mail</label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       autocomplete="email"
                       required>

                <small th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}">
                </small>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>

                <input type="password"
                       id="password"
                       th:field="*{password}"
                       autocomplete="new-password"
                       required>

                <small th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}">
                </small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Confirmer le mot de passe
                </label>

                <input type="password"
                       id="confirmPassword"
                       th:field="*{confirmPassword}"
                       autocomplete="new-password"
                       required>

                <small th:if="${#fields.hasErrors('confirmPassword')}"
                       th:errors="*{confirmPassword}">
                </small>
            </div>

            <button type="submit">
                Créer mon compte
            </button>

        </form>

        <p class="auth-link">
            Tu possèdes déjà un compte ?
            <a th:href="@{/auth/login}">Se connecter</a>
        </p>

    </div>

</main>

</body>
</html>
