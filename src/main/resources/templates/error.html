<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur | TubeMastery</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="auth-logo-icon">▶</span>
            TubeMastery
        </div>

        <h1 th:text="${status}">404</h1>
        <p th:if="${status == 404}">Cette page n'existe pas.</p>
        <p th:if="${status == 403}">Tu n'as pas accès à cette page.</p>
        <p th:unless="${status == 404 or status == 403}">Une erreur est survenue. Réessaie dans un instant.</p>

        <div class="auth-footer">
            <a th:href="@{/home}">Retour à l'accueil</a>
        </div>
    </div>
</div>

</body>
</html>
