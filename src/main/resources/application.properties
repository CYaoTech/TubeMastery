spring.application.name=TubeMastery
# Emplacement du fichier de la base de données (crée un fichier "youtubeur.mv.db" à la racine du projet)
spring.datasource.url=jdbc:h2:file:./youtubeur
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Active l'interface web pour voir la base de données sur le navigateur
spring.h2.console.enabled=true

# METTRE À JOUR les tables sans JAMAIS supprimer les données existantes
spring.jpa.hibernate.ddl-auto=update


# Scraping YouTube (requête HTTP + Jsoup). Une fiche n'est scrapée qu'à son premier tirage dans un paquet
youtube.scraper.timeout-seconds=10
