spring.application.name=TubeMastery
# Emplacement du fichier de la base de données (crée un fichier "the_db_file" à la racine du projet)
spring.datasource.url=jdbc:h2:file:./the_db_file
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Active l'interface web pour voir la base de données sur le navigateur
spring.h2.console.enabled=true

# METTRE À JOUR les tables sans JAMAIS supprimer les données existantes
spring.jpa.hibernate.ddl-auto=update


# Clé de la YouTube Data API v3 (lue depuis la variable d environnement YOUTUBE_API_KEY)
youtube.api.key=${YOUTUBE_API_KEY:}
